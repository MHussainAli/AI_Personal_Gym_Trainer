<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Trainer</title>
<style>
:root{--bg:#0b0f1a;--card:#141a2b;--line:#222b44;--text:#e8ecf8;--mute:#8b95b5;--a:#6ee7b7;--b:#60a5fa}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,Segoe UI,sans-serif;background:radial-gradient(1200px 600px at 10% -10%,#16223f,var(--bg));color:var(--text);min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 28px}
.logo{font-weight:800;font-size:20px;letter-spacing:.3px}.logo span{color:var(--a)}
main{display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);gap:20px;padding:0 28px 28px}
@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
h3{margin:0 0 12px;font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:1px}
.stage{position:relative;aspect-ratio:16/9;background:#05070d;border-radius:14px;overflow:hidden}
.stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.hud{position:absolute;left:14px;top:14px;display:flex;gap:10px;z-index:2}
.pill{background:rgba(11,15,26,.75);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:12px;padding:8px 14px}
.pill b{font-size:30px;display:block;line-height:1}.pill small{color:var(--mute);font-size:11px;text-transform:uppercase}
.bar{position:absolute;right:16px;top:16px;bottom:16px;width:22px;border-radius:12px;background:rgba(255,255,255,.1);overflow:hidden;z-index:2}
.bar i{position:absolute;bottom:0;left:0;right:0;height:0;background:linear-gradient(var(--a),var(--b));transition:height .08s}
.msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);z-index:1;text-align:center;padding:20px}
.controls{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
select,button{font:inherit;border-radius:12px;border:1px solid var(--line);background:#0f1527;color:var(--text);padding:11px 16px}
button{cursor:pointer;font-weight:600}
button.primary{background:linear-gradient(135deg,var(--a),var(--b));color:#06210f;border:0}
button:disabled{opacity:.45;cursor:not-allowed}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat b{font-size:24px;display:block}.stat small{color:var(--mute)}
.chart{display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:12px}
.chart div{flex:1;text-align:center;font-size:10px;color:var(--mute)}
.chart span{display:block;background:linear-gradient(var(--b),var(--a));border-radius:6px 6px 0 0;min-height:3px;margin-bottom:4px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
li small{color:var(--mute);display:block}
li button{padding:4px 10px;font-size:12px}
.side{display:flex;flex-direction:column;gap:20px}
</style>
</head>
<body>
<header><div class="logo">AI<span>Trainer</span></div><div style="color:var(--mute);font-size:13px" id="status">Ready</div></header>
<main>
  <section class="card">
    <div class="stage">
      <div class="msg" id="msg">Choose an exercise and press Start.<br>Allow camera access when asked.</div>
      <video id="video" playsinline muted></video>
      <canvas id="canvas"></canvas>
      <div class="hud">
        <div class="pill"><b id="reps">0</b><small>Reps</small></div>
        <div class="pill"><b id="timer">0:00</b><small>Time</small></div>
        <div class="pill"><b id="angle">--</b><small>Angle</small></div>
      </div>
      <div class="bar"><i id="fill"></i></div>
    </div>
    <div class="controls">
      <select id="exercise">
        <option value="curl">Bicep curl</option>
        <option value="squat">Squat</option>
        <option value="pushup">Push-up</option>
      </select>
      <button class="primary" id="start">Start</button>
      <button id="stop" disabled>Stop &amp; save</button>
    </div>
  </section>
  <aside class="side">
    <div class="card">
      <h3>Overview</h3>
      <div class="stats">
        <div class="stat"><b id="sWorkouts">0</b><small>Workouts</small></div>
        <div class="stat"><b id="sReps">0</b><small>Total reps</small></div>
        <div class="stat"><b id="sMin">0</b><small>Minutes</small></div>
      </div>
      <div class="chart" id="chart"></div>
    </div>
    <div class="card"><h3>History</h3><ul id="history"></ul></div>
  </aside>
</main>

<script type="module">
import { PoseLandmarker, FilesetResolver, DrawingUtils }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const $ = id => document.getElementById(id);
const video = $("video"), canvas = $("canvas"), ctx = canvas.getContext("2d");

const EX = {
  curl:   { L:[11,13,15], R:[12,14,16], flex:70,  ext:150 },
  pushup: { L:[11,13,15], R:[12,14,16], flex:90,  ext:155 },
  squat:  { L:[23,25,27], R:[24,26,28], flex:100, ext:160 },
};
const NAMES = { curl:"Bicep curl", squat:"Squat", pushup:"Push-up" };

let landmarker, running = false, stream, startTs = 0;
let reps = 0, stage = "up", smooth = null, timerId;

async function loadModel() {
  const fileset = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  landmarker = await PoseLandmarker.createFromOptions(fileset, {
    baseOptions: { modelAssetPath:
      "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
      delegate: "GPU" },
    runningMode: "VIDEO", numPoses: 1,
  });
}

function innerAngle(a, b, c, w, h) {
  const v1 = [(a.x-b.x)*w, (a.y-b.y)*h], v2 = [(c.x-b.x)*w, (c.y-b.y)*h];
  const d = Math.abs(Math.atan2(v2[1],v2[0]) - Math.atan2(v1[1],v1[0])) * 180/Math.PI;
  return d > 180 ? 360 - d : d;
}

function fmt(s){ return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }

async function start() {
  $("start").disabled = true; $("status").textContent = "Loading model...";
  try {
    if (!landmarker) await loadModel();
    stream = await navigator.mediaDevices.getUserMedia({ video:{ width:1280, height:720 }, audio:false });
  } catch (e) {
    $("status").textContent = "Error: " + e.message; $("start").disabled = false; return;
  }
  video.srcObject = stream; await video.play();
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  $("msg").style.display = "none";
  reps = 0; stage = "up"; smooth = null; startTs = Date.now(); running = true;
  $("reps").textContent = 0; $("stop").disabled = false; $("exercise").disabled = true;
  $("status").textContent = "Training: " + NAMES[$("exercise").value];
  timerId = setInterval(() => $("timer").textContent = fmt(Math.floor((Date.now()-startTs)/1000)), 500);
  loop();
}

function loop() {
  if (!running) return;
  const res = landmarker.detectForVideo(video, performance.now());
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const lm = res.landmarks && res.landmarks[0];
  if (lm) {
    const du = new DrawingUtils(ctx);
    du.drawConnectors(lm, PoseLandmarker.POSE_CONNECTIONS, { color:"#6ee7b7", lineWidth:4 });
    du.drawLandmarks(lm, { color:"#60a5fa", radius:4 });
    const cfg = EX[$("exercise").value];
    const vis = ids => ids.reduce((s,i) => s + (lm[i].visibility ?? 0), 0);
    const ids = vis(cfg.L) > vis(cfg.R) ? cfg.L : cfg.R;
    const raw = innerAngle(lm[ids[0]], lm[ids[1]], lm[ids[2]], canvas.width, canvas.height);
    smooth = smooth === null ? raw : smooth * 0.6 + raw * 0.4;
    $("angle").textContent = Math.round(smooth) + "°";
    const per = Math.max(0, Math.min(100, (cfg.ext - smooth) / (cfg.ext - cfg.flex) * 100));
    $("fill").style.height = per + "%";
    if (smooth < cfg.flex && stage === "up") stage = "down";
    else if (smooth > cfg.ext && stage === "down") { stage = "up"; reps++; $("reps").textContent = reps; }
  }
  requestAnimationFrame(loop);
}

async function stop() {
  running = false; clearInterval(timerId);
  stream && stream.getTracks().forEach(t => t.stop());
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  $("msg").style.display = "grid"; $("msg").textContent = "Session finished.";
  const duration = Math.floor((Date.now() - startTs) / 1000);
  if (reps > 0) {
    await fetch("/api/workouts", { method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ exercise:$("exercise").value, reps, duration_sec:duration }) });
    $("status").textContent = `Saved: ${reps} reps`;
  } else $("status").textContent = "No reps counted, nothing saved";
  $("start").disabled = false; $("stop").disabled = true; $("exercise").disabled = false;
  refresh();
}

async function refresh() {
  const [s, h] = await Promise.all([fetch("/api/stats").then(r => r.json()), fetch("/api/workouts").then(r => r.json())]);
  $("sWorkouts").textContent = s.total_workouts;
  $("sReps").textContent = s.total_reps;
  $("sMin").textContent = Math.round(s.total_seconds / 60);
  const days = [], map = Object.fromEntries(s.last7.map(d => [d.day, d.reps]));
  for (let i = 6; i >= 0; i--) { const d = new Date(Date.now() - i*864e5).toISOString().slice(0,10); days.push([d, map[d] || 0]); }
  const max = Math.max(1, ...days.map(d => d[1]));
  $("chart").innerHTML = days.map(([d,v]) =>
    `<div><span style="height:${v/max*80}px"></span>${d.slice(8)}</div>`).join("");
  $("history").innerHTML = h.length ? h.map(w =>
    `<li><div>${NAMES[w.exercise]} · ${w.reps} reps<small>${w.created_at} UTC · ${fmt(w.duration_sec)}</small></div>
     <button data-id="${w.id}">Delete</button></li>`).join("") : "<li>No workouts yet</li>";
}

$("history").addEventListener("click", async e => {
  const id = e.target.dataset.id;
  if (id) { await fetch("/api/workouts/" + id, { method:"DELETE" }); refresh(); }
});
$("start").onclick = start; $("stop").onclick = stop;
refresh();
</script>
</body>
</html>
